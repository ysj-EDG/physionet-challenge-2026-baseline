version: 1
workspace: ..
exclude:
  - .git/
  - __pycache__/
  - eeg_qc/
  - data/
  - data2/
  - npz_new/
  - npz_1103_timegrid_v2/
  - npz_data2/
  - output/
  - baseline_results/
  - temporal_results/
  - data2_l0_h100_results/
  - p5_h100_results/
  - feat_input/data2_smoke_logs/
include:
  - src: npz_data2
    dst: .
    keep: false
env: eeg_env
device: auto
run:
  script: temporal/run_loso.py --modality stage_event13 --data-root npz_data2 --output-root temporal_results/stage_event13
  wait: true
rsync_back:
  - temporal_results/stage_event13
